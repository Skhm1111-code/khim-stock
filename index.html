<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHIM - ប្រព័ន្ធរាប់ស្តុក</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f4f5f7;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Top Header Bar (Logo + KHIM left, Hamburger menu right) */
        .top-header {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-square {
            width: 32px;
            height: 32px;
            border: 2.2px solid #111827;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            background: #f9fafb;
        }

        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #111827;
        }

        .menu-trigger {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            border-radius: 10px;
        }
        .menu-trigger:active { background: #f3f4f6; }
        .menu-line {
            width: 22px;
            height: 2.4px;
            background: #111827;
            border-radius: 2px;
        }

        /* Main Mobile Frame */
        .mobile-wrap {
            width: 100%;
            max-width: 480px;
            padding: 18px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. Search / Scan Box with Magnifying Glass */
        .search-box {
            width: 100%;
            position: relative;
            margin-bottom: 24px;
        }

        .search-box input {
            width: 100%;
            height: 50px;
            padding: 0 48px 0 18px;
            background: #ffffff;
            border: 2px solid #111827;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            outline: none;
            text-transform: uppercase;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }
        .search-box input::placeholder {
            color: #9ca3af;
            font-weight: 500;
            text-transform: none;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border: none;
            background: transparent;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* 3. Center Main Card (Y300 / ក្រដាសសើម / 1.5$ / = 340 / 15.11.26) */
        .product-card {
            width: 100%;
            background: #ffffff;
            border: 2px solid #111827;
            border-radius: 22px;
            padding: 22px 22px 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-code {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 30px;
            font-weight: 800;
            color: #14532d;
            line-height: 1.1;
        }

        .item-price {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #111827;
            line-height: 1.1;
        }

        .item-name {
            font-size: 18px;
            font-weight: 700;
            color: #374151;
            margin-top: 6px;
            padding-bottom: 14px;
            border-bottom: 1.5px dashed #e5e7eb;
        }

        /* Center Body: Colors List on Left + Big "= 340" Total on Right/Center */
        .card-middle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 0;
            min-height: 135px;
            gap: 12px;
        }

        .color-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .color-bullet {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
            background: #f9fafb;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .color-bullet-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mini-btn {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mini-btn.add {
            background: #14532d;
            color: #ffffff;
            border-color: #14532d;
        }

        .big-total-box {
            text-align: right;
            padding-left: 8px;
        }

        .big-total-num {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        /* Single item direct stepper when no colors */
        .single-stepper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }

        .card-bottom-date {
            text-align: right;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #6b7280;
            padding-top: 8px;
            border-top: 1px solid #f3f4f6;
        }

        /* 4. Bottom 3 Action Buttons (Download arrow, Copy, Edit) */
        .bottom-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 22px;
            width: 100%;
        }

        .action-box-btn {
            width: 58px;
            height: 54px;
            background: #ffffff;
            border: 2px solid #111827;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            color: #111827;
            box-shadow: 0 3px 0 #111827;
            transition: 0.1s;
        }
        .action-box-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #111827;
        }
        .action-box-btn span {
            font-size: 10px;
            font-weight: 700;
        }

        /* Quick Switch Pills below actions */
        .quick-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            width: 100%;
        }
        .q-tag {
            background: #ffffff;
            border: 1px solid #d1d5db;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
        }
        .q-tag.active {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
        }

        /* Drawer Modal for Menu (Add Item / Import Excel) */
        .drawer-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .drawer-bg.open { display: flex; }

        .drawer-sheet {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px 24px 0 0;
            padding: 22px 20px 32px;
            max-height: 88vh;
            overflow-y: auto;
        }

        .field-label {
            font-size: 12px;
            font-weight: 700;
            color: #4b5563;
            display: block;
            margin: 10px 0 4px;
        }
        .sheet-input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }
        .sheet-input:focus { border-color: #111827; }

        .btn-black {
            width: 100%;
            padding: 13px;
            background: #111827;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. Top Header Bar -->
    <header class="top-header">
        <div class="brand-left">
            <div class="brand-square">K</div>
            <div class="brand-title">KHIM</div>
        </div>
        <button class="menu-trigger" onclick="openDrawer()" aria-label="Menu">
            <div class="menu-line"></div>
            <div class="menu-line"></div>
            <div class="menu-line"></div>
        </button>
    </header>

    <!-- Main Mobile Container -->
    <main class="mobile-wrap">

        <!-- 2. Search / Scan Input -->
        <div class="search-box">
            <input type="text" id="scanInput" placeholder="ស្កែន ឬ វាយកូដ ឧ. Y300, G1..." autofocus>
            <button class="search-btn" onclick="handleSearch()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <!-- 3. Center Product Card (Matches Hand-Drawn Sketch) -->
        <div class="product-card" id="captureCard">
            <div class="card-top-row">
                <div class="item-code" id="dispCode">Y300</div>
                <div class="item-price" id="dispPrice">1.5$</div>
            </div>
            <div class="item-name" id="dispName">ក្រដាសសើម</div>

            <div class="card-middle">
                <!-- Left: Color / Variant Lines -->
                <div class="color-list" id="dispColors"></div>

                <!-- Right/Center: Big "= 340" Total -->
                <div class="big-total-box">
                    <div class="big-total-num" id="dispTotal">= 340</div>
                    <div class="single-stepper" id="singleControls" style="display:none;">
                        <button class="mini-btn" onclick="changeSingleQty(-1)">−</button>
                        <button class="mini-btn add" onclick="changeSingleQty(1)">+</button>
                    </div>
                </div>
            </div>

            <div class="card-bottom-date" id="dispDate">15.11.26</div>
        </div>

        <!-- 4. Bottom 3 Action Buttons (Download, Copy, Edit) -->
        <div class="bottom-actions">
            <!-- Button 1: Download PNG (Downward Arrow) -->
            <button class="action-box-btn" onclick="downloadCardImage()" title="ទាញយករូបភាព">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="4" x2="12" y2="16"></line>
                    <polyline points="7 11 12 16 17 11"></polyline>
                    <line x1="5" y1="20" x2="19" y2="20"></line>
                </svg>
                <span>រូបភាព</span>
            </button>

            <!-- Button 2: Copy Text -->
            <button class="action-box-btn" onclick="copyCardText()" title="Copy ផ្ញើ Telegram">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
            </button>

            <!-- Button 3: Edit / Add New -->
            <button class="action-box-btn" onclick="openDrawer()" title="កែប្រែ / បន្ថែមកូដ">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                <span>កែប្រែ</span>
            </button>
        </div>

        <!-- Quick Code Switcher -->
        <div class="quick-bar" id="quickTags"></div>

    </main>

    <!-- Slide-up Menu Drawer (Add Code & Upload Excel) -->
    <div class="drawer-bg" id="menuDrawer" onclick="if(event.target===this) closeDrawer()">
        <div class="drawer-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="font-size:18px; font-weight:800;">បញ្ចូលកូដ និង File Excel</h3>
                <button onclick="closeDrawer()" style="border:none; background:#f3f4f6; padding:6px 12px; border-radius:10px; font-weight:700; cursor:pointer;">បិទ</button>
            </div>

            <label class="field-label">កូដអីវ៉ាន់ (ឧ. Y300, G1, G2)</label>
            <input type="text" id="editCode" class="sheet-input" placeholder="Y300">

            <label class="field-label">ឈ្មោះអីវ៉ាន់ (ឧ. ក្រដាសសើម)</label>
            <input type="text" id="editName" class="sheet-input" placeholder="ក្រដាសសើម">

            <label class="field-label">តម្លៃ ($)</label>
            <input type="number" step="0.1" id="editPrice" class="sheet-input" value="1.5">

            <label class="field-label">ពណ៌ និងចំនួន (ដាក់ក្បៀស , បើមានច្រើន / ឬវាយតែចំនួនសរុប)</label>
            <input type="text" id="editColors" class="sheet-input" placeholder="ឧ. ខ្មៅ:120, ដី:220 (ឬ 340)">

            <button class="btn-black" onclick="saveItemFromDrawer()">រក្សាទុកអីវ៉ាន់</button>

            <hr style="border:none; border-top:1px solid #e5e7eb; margin:18px 0;">

            <label class="field-label">នាំចូល File Excel (.xlsx, .csv)</label>
            <input type="file" accept=".xlsx,.xls,.csv" onchange="importExcel(event)" class="sheet-input">
            <p id="excelStatus" style="font-size:12px; color:#14532d; font-weight:700; margin-top:6px;"></p>

            <button class="btn-black" style="background:#14532d;" onclick="exportExcel()">Export ជា File Excel (.xlsx)</button>
        </div>
    </div>

    <script>
        let itemsDB = JSON.parse(localStorage.getItem('khim_mobile_db_v1')) || [
            {
                code: "Y300",
                name: "ក្រដាសសើម",
                price: 1.5,
                singleQty: 340,
                colors: []
            },
            {
                code: "G1",
                name: "ម៉ូត G1",
                price: 5.0,
                singleQty: 0,
                colors: [
                    { name: "ខ្មៅ", qty: 12 },
                    { name: "ដី", qty: 18 }
                ]
            },
            {
                code: "G2",
                name: "ម៉ូត G2",
                price: 5.5,
                singleQty: 0,
                colors: [
                    { name: "ខ្មៅ", qty: 9 },
                    { name: "ដី", qty: 15 }
                ]
            }
        ];

        let activeCode = "Y300";

        function saveStorage() {
            localStorage.setItem('khim_mobile_db_v1', JSON.stringify(itemsDB));
            renderQuickTags();
        }

        function getShortDate() {
            const d = new Date();
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yy = String(d.getFullYear()).slice(-2);
            return `${dd}.${mm}.${yy}`;
        }

        function handleSearch() {
            const input = document.getElementById('scanInput');
            const q = input.value.trim().toUpperCase();
            if (!q) return;
            input.value = '';

            const found = itemsDB.find(i => i.code.toUpperCase() === q);
            if (found) {
                activeCode = found.code;
                renderCard();
            } else {
                alert(`រកមិនឃើញកូដ "${q}" ទេ! ចុចប៊ូតុង "កែប្រែ" ដើម្បីបង្កើតកូដថ្មី។`);
            }
        }

        function selectCode(code) {
            activeCode = code;
            renderCard();
        }

        function changeColorQty(idx, delta) {
            const item = itemsDB.find(i => i.code === activeCode);
            if (!item || !item.colors[idx]) return;
            item.colors[idx].qty = Math.max(0, (item.colors[idx].qty || 0) + delta);
            saveStorage();
            renderCard();
        }

        function changeSingleQty(delta) {
            const item = itemsDB.find(i => i.code === activeCode);
            if (!item) return;
            item.singleQty = Math.max(0, (item.singleQty || 0) + delta);
            saveStorage();
            renderCard();
        }

        function renderCard() {
            const item = itemsDB.find(i => i.code === activeCode) || itemsDB[0];
            if (!item) return;
            activeCode = item.code;

            document.getElementById('dispCode').innerText = item.code;
            document.getElementById('dispName').innerText = item.name;
            document.getElementById('dispPrice').innerText = `${item.price}$`;
            document.getElementById('dispDate').innerText = getShortDate();

            const colorBox = document.getElementById('dispColors');
            const singleCtrl = document.getElementById('singleControls');

            if (item.colors && item.colors.length > 0) {
                singleCtrl.style.display = 'none';
                let sum = 0;
                colorBox.innerHTML = item.colors.map((c, idx) => {
                    sum += (c.qty || 0);
                    return `
                        <div class="color-bullet">
                            <div class="color-bullet-left">
                                <span>• ${c.name}</span>
                            </div>
                            <div class="mini-controls">
                                <button class="mini-btn" onclick="changeColorQty(${idx}, -1)">−</button>
                                <span style="min-width:22px; text-align:center;">${c.qty}</span>
                                <button class="mini-btn add" onclick="changeColorQty(${idx}, 1)">+</button>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('dispTotal').innerText = `= ${sum}`;
            } else {
                singleCtrl.style.display = 'flex';
                colorBox.innerHTML = `
                    <div style="color:#6b7280; font-size:14px; font-weight:600; line-height:1.8;">
                        <div>• ស្តុកទូទៅ</div>
                        <div>• គ្មានបែងចែកពណ៌</div>
                    </div>
                `;
                document.getElementById('dispTotal').innerText = `= ${item.singleQty || 0}`;
            }

            renderQuickTags();
        }

        function renderQuickTags() {
            const bar = document.getElementById('quickTags');
            bar.innerHTML = itemsDB.map(i => `
                <button class="q-tag ${i.code === activeCode ? 'active' : ''}" onclick="selectCode('${i.code}')">${i.code}</button>
            `).join('');
        }

        function downloadCardImage() {
            // Hide +/- buttons cleanly during PNG capture so image looks pure like sketch
            const btns = document.querySelectorAll('.mini-btn, #singleControls');
            btns.forEach(b => b.style.visibility = 'hidden');

            html2canvas(document.getElementById('captureCard'), { scale: 3, backgroundColor: '#ffffff' }).then(canvas => {
                btns.forEach(b => b.style.visibility = 'visible');
                const a = document.createElement('a');
                a.download = `KHIM_${activeCode}_${Date.now()}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
            });
        }

        function copyCardText() {
            const item = itemsDB.find(i => i.code === activeCode);
            if (!item) return;
            let txt = `${item.code} - ${item.name} (${item.price}$)\n`;
            if (item.colors && item.colors.length > 0) {
                let sum = 0;
                item.colors.forEach(c => {
                    sum += c.qty;
                    txt += `- ${c.name}: ${c.qty}\n`;
                });
                txt += `= ${sum}\n`;
            } else {
                txt += `= ${item.singleQty}\n`;
            }
            txt += `📅 ${getShortDate()}`;
            navigator.clipboard.writeText(txt);
            alert(`បាន Copy ${item.code} រួចរាល់!`);
        }

        function openDrawer() {
            const item = itemsDB.find(i => i.code === activeCode);
            if (item) {
                document.getElementById('editCode').value = item.code;
                document.getElementById('editName').value = item.name;
                document.getElementById('editPrice').value = item.price;
                if (item.colors && item.colors.length > 0) {
                    document.getElementById('editColors').value = item.colors.map(c => `${c.name}:${c.qty}`).join(', ');
                } else {
                    document.getElementById('editColors').value = item.singleQty || 0;
                }
            }
            document.getElementById('menuDrawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('menuDrawer').classList.remove('open');
        }

        function saveItemFromDrawer() {
            const code = document.getElementById('editCode').value.trim().toUpperCase();
            const name = document.getElementById('editName').value.trim();
            const price = parseFloat(document.getElementById('editPrice').value) || 0;
            const raw = document.getElementById('editColors').value.trim();

            if (!code || !name) return alert("សូមបំពេញកូដ និងឈ្មោះអីវ៉ាន់!");

            let colors = [];
            let singleQty = 0;

            if (raw && isNaN(raw)) {
                raw.split(',').forEach(part => {
                    const clean = part.trim();
                    if (!clean) return;
                    if (clean.includes(':')) {
                        const [cName, cQty] = clean.split(':');
                        colors.push({ name: cName.trim(), qty: parseInt(cQty) || 0 });
                    } else {
                        colors.push({ name: clean, qty: 0 });
                    }
                });
            } else {
                singleQty = parseInt(raw) || 0;
            }

            const idx = itemsDB.findIndex(i => i.code === code);
            if (idx >= 0) itemsDB[idx] = { code, name, price, singleQty, colors };
            else itemsDB.push({ code, name, price, singleQty, colors });

            activeCode = code;
            saveStorage();
            renderCard();
            closeDrawer();
        }

        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const map = {};

                    rows.slice(1).forEach(r => {
                        if (!r || r.length === 0) return;
                        let col0 = String(r[0] || '').trim();
                        if (!col0 || col0.toUpperCase() === 'CODE' || col0 === 'កូដ') return;

                        let code = col0.toUpperCase();
                        let name = String(r[1] || code).trim();
                        let colorName = String(r[2] || '').trim();
                        let price = parseFloat(r[3]) || 0;
                        let qty = parseInt(r[4]) || 0;

                        if (!colorName && col0.includes(' ')) {
                            const parts = col0.split(/\s+/);
                            code = parts[0].toUpperCase();
                            colorName = parts.slice(1).join(' ');
                        }

                        if (!map[code]) map[code] = { code, name, price, singleQty: 0, colors: [] };
                        if (colorName && colorName !== '-' && colorName !== 'undefined') {
                            const ex = map[code].colors.find(c => c.name === colorName);
                            if (!ex) map[code].colors.push({ name: colorName, qty });
                            else ex.qty += qty;
                        } else {
                            map[code].singleQty += qty;
                        }
                    });

                    const list = Object.values(map);
                    if (list.length > 0) {
                        itemsDB = list;
                        activeCode = list[0].code;
                        saveStorage();
                        renderCard();
                        document.getElementById('excelStatus').innerText = `ទាញចូលជោគជ័យ ${list.length} កូដ!`;
                    }
                } catch (err) {
                    alert("មានបញ្ហាក្នុងការអាន File Excel!");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportExcel() {
            const rows = [["Code", "Name", "Color", "Price", "Qty"]];
            itemsDB.forEach(i => {
                if (i.colors && i.colors.length > 0) {
                    i.colors.forEach(c => rows.push([i.code, i.name, c.name, i.price, c.qty]));
                } else {
                    rows.push([i.code, i.name, "-", i.price, i.singleQty || 0]);
                }
            });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "KHIM_Stock");
            XLSX.writeFile(wb, `KHIM_Stock_${getShortDate()}.xlsx`);
        }

        document.getElementById('scanInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') handleSearch();
        });

        renderCard();
    </script>
</body>
</html>
